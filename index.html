<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d12">
<title>Brooklyn Commute</title>
<style>
:root{
  --bg:#0b0d12; --card:#151924; --card2:#1b2130; --text:#f2f4f8; --muted:#9aa3b5;
  --green:#34c759; --amber:#ff9f0a; --red:#ff453a; --blue:#0a84ff; --line:#2a3145;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.45;}
#app{max-width:520px; margin:0 auto; padding:12px 12px 40px;}
.tier{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 14px; margin-bottom:12px;}
.tier h2{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:600;}
.row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.wx-temp{font-size:34px; font-weight:700;}
.wx-sub{color:var(--muted); font-size:13px; margin-top:2px;}
.badge{display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:30px;
  border-radius:8px; font-weight:800; font-size:16px; color:#fff; padding:0 8px; margin-right:8px;}
.dot{width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; flex:none;}
.dot.green{background:var(--green);} .dot.amber{background:var(--amber);}
.dot.red{background:var(--red);} .dot.blue{background:var(--blue);} .dot.gray{background:#6b7280;}
.leg{border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:8px 0; background:var(--card2);}
.leg-head{display:flex; align-items:center; font-weight:700; font-size:16px;}
.leg-sub{color:var(--muted); font-size:13px; margin-top:4px;}
.leg-time{font-size:15px; margin-top:6px;}
.leg-time b{font-size:17px;}
.transfer{background:#20283c; border:1px dashed #3b4a63;}
.alert-text{font-size:13px; color:var(--muted); margin-top:6px;}
.status-line{display:flex; align-items:center; font-size:14px; font-weight:600; margin-top:6px;}
button{font:inherit;}
.btn{background:#2a3350; color:var(--text); border:1px solid var(--line); border-radius:10px;
  padding:9px 12px; font-weight:600; cursor:pointer;}
.btn.primary{background:#0a84ff; border-color:#0a84ff; color:#fff;}
.btn.block{width:100%; margin-top:10px;}
#dir-toggle{width:100%; padding:11px; font-size:15px;}
.updated{color:var(--muted); font-size:12px; text-align:center; margin-top:6px;}
.alt{border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:8px 0; background:var(--card2);}
.alt b{font-size:15px;}
.allclear{color:var(--green); font-weight:600;}
/* settings sheet */
#sheet{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; z-index:50;
  align-items:flex-end; justify-content:center;}
#sheet.open{display:flex;}
#sheet-card{background:#141824; width:100%; max-width:520px; max-height:92vh; overflow-y:auto;
  border-radius:18px 18px 0 0; padding:16px 16px 30px; border:1px solid var(--line);}
#sheet-card h2{margin:0 0 4px; font-size:18px;}
.f-label{font-size:13px; color:var(--muted); margin:12px 0 4px; font-weight:600;}
.f-input{width:100%; background:#0f1320; color:var(--text); border:1px solid var(--line);
  border-radius:10px; padding:10px 12px; font-size:15px;}
.picker{position:relative;}
.picker-list{position:absolute; top:100%; left:0; right:0; background:#1c2233; border:1px solid var(--line);
  border-radius:10px; margin-top:4px; max-height:240px; overflow-y:auto; z-index:60; display:none;}
.picker-list.open{display:block;}
.picker-item{padding:9px 12px; border-bottom:1px solid #242c42; cursor:pointer; font-size:14px;}
.picker-item:last-child{border-bottom:none;}
.picker-item .badge{min-width:24px; height:24px; font-size:13px; margin-right:6px; border-radius:6px;}
.linechips{margin-top:6px; display:flex; gap:6px; flex-wrap:wrap;}
.chip{background:#0f1320; border:1px solid var(--line); color:var(--text); border-radius:999px;
  padding:5px 12px; font-size:13px; cursor:pointer;}
.chip.sel{background:#0a84ff; border-color:#0a84ff; color:#fff; font-weight:700;}
.picked{font-size:13px; color:var(--muted); margin-top:4px;}
.topbar{display:flex; gap:8px; margin-bottom:12px;}
.topbar .btn{flex:1;}
.err{background:#3a1d1d; border:1px solid #7a2e2e; color:#ffb4ab; border-radius:12px; padding:10px 12px; margin-bottom:12px; font-size:14px;}
.small{font-size:12px; color:var(--muted);}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <button class="btn" id="refresh-btn">&#8635; Refresh</button>
    <button class="btn" id="settings-btn">&#9881; Settings</button>
  </div>
  <div id="err" class="err" style="display:none"></div>

  <section class="tier" id="tier-weather">
    <h2>Weather &middot; Brooklyn</h2>
    <div class="row">
      <div>
        <div class="wx-temp" id="wx-temp">&ndash;</div>
        <div class="wx-sub" id="wx-desc">&ndash;</div>
      </div>
      <div style="text-align:right">
        <div class="wx-sub" id="wx-hilo">&ndash;</div>
        <div class="wx-sub" id="wx-feel"></div>
      </div>
    </div>
  </section>

  <section class="tier" id="tier-route">
    <h2>Your route</h2>
    <button class="btn" id="dir-toggle">To Work &#8646;</button>
    <div id="legs" style="margin-top:4px"></div>
  </section>

  <section class="tier" id="tier-alt">
    <h2>Alternatives</h2>
    <div id="alts"></div>
  </section>

  <div class="updated" id="updated"></div>
</div>

<div id="sheet">
  <div id="sheet-card">
    <div class="row">
      <h2>Commute settings</h2>
      <button class="btn" id="sheet-close">Done</button>
    </div>
    <div class="f-label">Home address</div>
    <input class="f-input" id="set-home" placeholder="e.g. 595 Dean St, Brooklyn NY 11238">
    <div class="f-label">Work address</div>
    <input class="f-input" id="set-work" placeholder="e.g. 7 Bushwick Pl, Brooklyn NY 11206">
    <div class="f-label">Boarding station</div>
    <div class="picker" id="pk1"></div>
    <div class="f-label">Transfer: get off</div>
    <div class="picker" id="pk2"></div>
    <div class="f-label">Transfer: board</div>
    <div class="picker" id="pk3"></div>
    <div class="f-label">Arrival station</div>
    <div class="picker" id="pk4"></div>
    <button class="btn primary block" id="set-save">Save</button>
    <div class="small" style="margin-top:8px">Addresses are geocoded once and stored on this device only.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/protobufjs@7.4.0/dist/protobuf.min.js"></script>

const $ = id=>document.getElementById(id);

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtClock(sec){ return new Date(sec*1000).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZone:TZ}); }
function fmtHM(){ return new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",second:"2-digit",timeZone:TZ}); }
function countdown(sec){
  const m=Math.round((sec-Date.now()/1000)/60);
  if(m<=0) return "now";
  return m===1 ? "1 min" : m+" min";
}
function tempBoth(f){ return Math.round(f)+"°F ("+Math.round((f-32)*5/9)+"°C)"; }
function havKm(a,b,c,d){
  const R=6371, t=Math.PI/180;
  const h=Math.sin((c-a)*t/2)**2 + Math.cos(a*t)*Math.cos(c*t)*Math.sin((d-b)*t/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function lineBadge(line){
  const col=LINE_COLORS[line]||"#666";
  const dark=(line==="N"||line==="Q"||line==="R"||line==="W"||line==="L");
  return '<span class="badge" style="background:'+col+';color:'+(dark?"#111":"#fff")+'">'+esc(line)+'</span>';
}

function stopSet(stationId){
  const set=new Set();

}

/* ===== geocode (Nominatim, cached) ===== */
const GEO_KEY="brooklyn_commute_geo_v1";
function geoGet(k){
  try{ const c=JSON.parse(localStorage.getItem(GEO_KEY)||"{}"); return c[k]||null; }catch(e){ return null; }
}
function geoPut(k,v){
  try{ const c=JSON.parse(localStorage.getItem(GEO_KEY)||"{}"); c[k]=v; localStorage.setItem(GEO_KEY,JSON.stringify(c)); }catch(e){}
}
async function geocode(label){
  const key=label.trim().toLowerCase();
  if(!key) return null;
  const hit=geoGet(key);
  if(hit) return hit;
  const url="https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(label);
  const r=await fetch(url,{headers:{"Accept":"application/json"}});
  const j=await r.json();
  if(j&&j[0]){
    const v={lat:parseFloat(j[0].lat), lon:parseFloat(j[0].lon)};
    geoPut(key,v);
    return v;
  }
  return null;
}

/* ===== walk time (OSRM foot, haversine fallback) ===== */
async function walkMinutes(aLat,aLon,bLat,bLon){
  try{
    const u="https://router.project-osrm.org/route/v1/foot/"+aLon+","+aLat+";"+bLon+","+bLat+"?overview=false";
    const r=await fetch(u);
    const j=await r.json();
    // NOTE: the public OSRM demo server sometimes returns car-like durations
    // for the foot profile, so derive walk time from route distance instead.
    if(j.routes&&j.routes[0]&&j.routes[0].distance) return (j.routes[0].distance/1000)/4.8*60;
  }catch(e){}
  return havKm(aLat,aLon,bLat,bLon)/4.5*60;
}

}

/* ===== MTA service status (alerts JSON) ===== */
let lineStatus={}, stationNotes=[];
async function fetchStatus(){
  const r=await fetch(ALERTS_URL);
  const j=await r.json();
  const now=Math.floor(Date.now()/1000);
  lineStatus={}; stationNotes=[];
  const items=[];
  for(const e of (j.entity||[])){
    const a=e.alert||{};
    let active=false;
    for(const ap of (a.active_period||[])){
      const s=num(ap.start), en=num(ap.end)||1e15;
      if(s<=now&&now<=en){ active=true; break; }
    }
    if(!active) continue;
    items.push(a);
  }
  for(const a of items){
    const mtype=((a["transit_realtime.mercury_alert"])||{}).alert_type||"";
    const cls=SEV_CLASS[mtype]||"blue";
    const tr=((a.header_text||{}).translation||[]).find(t=>t.language==="en");
    const title=tr?tr.text:"Service change";
    for(const ie of (a.informed_entity||[])){
      if(ie.route_id&&!ie.stop_id){
        const cur=lineStatus[ie.route_id];
        if(!cur||SEV_RANK[cls]>SEV_RANK[cur.cls]) lineStatus[ie.route_id]={cls:cls,text:title};
      }
    }
  }
  const myStops=new Set();
  ["s1","s2","s3","s4"].forEach(k=>{ stopSet(S[k].stationId).forEach(x=>myStops.add(x)); });
  for(const a of items){
    const tr=((a.header_text||{}).translation||[]).find(t=>t.language==="en");
    const title=tr?tr.text:"Service change";
    for(const ie of (a.informed_entity||[])){
      if(ie.stop_id){
        const sid=String(ie.stop_id).replace(/[NS]$/,"");
        if(myStops.has(sid)||myStops.has(ie.stop_id)){ stationNotes.push(title); break; }
      }
    }
  }
}
function statusOf(line){
  return lineStatus[line]||{cls:"green",text:""};
}


/* ===== MTA arrivals (GTFS-RT protobuf) ===== */
let FeedMessage=null;
async function ensureProto(){
  if(FeedMessage) return;
  if(typeof protobuf==="undefined") throw new Error("protobuf library failed to load");
  const bin=atob(PROTO_B64);
  // keepCase:true keeps proto field names as snake_case (trip_update, route_id,
  // stop_time_update, stop_id). Without it protobufjs converts them to camelCase
  // and the arrival lookup below silently finds nothing.
  const root=protobuf.parse(bin, {keepCase:true}).root;
  FeedMessage=root.lookupType("transit_realtime.FeedMessage");
}
async function fetchFeed(feedPath){
  await ensureProto();
  const r=await fetch(MTA+feedPath);
  if(!r.ok) throw new Error("feed "+feedPath+" HTTP "+r.status);
  const buf=await r.arrayBuffer();
  return FeedMessage.decode(new Uint8Array(buf));
}
function findTrips(feed,line,fromId,toId,after,strict){
  const from=stopSet(fromId), to=stopSet(toId);
  const out=[];
  const cutoff = strict ? after : after-120;
  for(const e of (feed.entity||[])){
    const tu=e.trip_update;
    if(!tu||!tu.trip) continue;
    if((tu.trip.route_id||"")!==line) continue;
    const stus=tu.stop_time_update||[];
    let bi=-1;
    for(let i=0;i<stus.length;i++){
      const raw=stus[i].stop_id||"";
      if(from.has(raw)||from.has(raw.replace(/[NS]$/,""))){ bi=i; break; }
    }
    if(bi<0) continue;
    let ai=-1;
    for(let i=bi+1;i<stus.length;i++){
      const raw=stus[i].stop_id||"";
      if(to.has(raw)||to.has(raw.replace(/[NS]$/,""))){ ai=i; break; }
    }
    if(ai<0) continue;
    const bt=num(stus[bi].arrival&&stus[bi].arrival.time)||num(stus[bi].departure&&stus[bi].departure.time);
    const at=num(stus[ai].arrival&&stus[ai].arrival.time)||num(stus[ai].departure&&stus[ai].departure.time);
    if(!bt||bt<cutoff) continue;
    out.push({bt:bt, at:at||0});
  }
  out.sort((x,y)=>x.bt-y.bt);
  return out;
}

/* ===== route model ===== */
function getLegs(){
  if(S.direction==="commute"){
    return [
      {line:S.s1.line, from:S.s1.stationId, to:S.s2.stationId, kind:"ride"},
      {line:S.s3.line, from:S.s3.stationId, to:S.s4.stationId, kind:"ride"}
    ];
  }
  return [
    {line:S.s3.line, from:S.s4.stationId, to:S.s3.stationId, kind:"ride"},
    {line:S.s1.line, from:S.s2.stationId, to:S.s1.stationId, kind:"ride"}
  ];
}
function originInfo(){
  return S.direction==="commute" ? S.home : S.work;
}

async function fetchFeeds(lines){
  const need=[...new Set(lines.map(l=>FEED_FOR[l]).filter(Boolean))];
  const feeds={};
  await Promise.all(need.map(async f=>{
    try{ feeds[f]=await fetchFeed(f); }catch(e){ feeds[f]=null; }
  }));
  return feeds;
}

async function computeRoute(legs){
  const feeds=await fetchFeeds(legs.map(l=>l.line));
  const now=Math.floor(Date.now()/1000);
  const out=[];
  let after=now-60, strict=false;
  for(const leg of legs){
    const feed=feeds[FEED_FOR[leg.line]];
    let trips=feed?findTrips(feed,leg.line,leg.from,leg.to,after,strict):[];
    const t=trips.length?trips[0]:null;
    out.push({leg:leg, trip:t, feedOk:!!feed});
    if(t&&t.at){ after=t.at; strict=true; }
  }
  return out;
}

/* ===== alternatives ===== */
function findAlternatives(legResults){
  const bad=new Set();
  legResults.forEach(r=>{
    const st=statusOf(r.leg.line);
    if(st.cls==="red"||st.cls==="amber") bad.add(r.leg.line);
  });
  if(!bad.size) return [];
  const o=originInfo();
  const cands=[];
  for(const s of STATIONS){
    const good=s.lines.filter(l=>!bad.has(l));
    if(!good.length) continue;
    const d=havKm(o.lat,o.lon,s.lat,s.lon);
    if(d<=1.8) cands.push({s:s, lines:good, d:d});
  }
  cands.sort((a,b)=>a.d-b.d);
  return cands.slice(0,2).map(c=>({
    stationId:c.s.id, name:c.s.name, lines:c.lines.slice(0,3),
    walkMin:Math.max(1,Math.round(c.d/4.5*60))
  }));
}

/* ===== render ===== */
function dotCls(cls){ return cls==="green"?"green":cls; }
function renderWeather(w){
  try{
    const cur=w.current, daily=w.daily;
    $("wx-temp").textContent=tempBoth(cur.temperature_2m);
    $("wx-desc").textContent=WMO[cur.weather_code]||"";
    $("wx-hilo").textContent="H "+tempBoth(daily.temperature_2m_max[0])+"  ·  L "+tempBoth(daily.temperature_2m_min[0]);
  }catch(e){
    $("wx-temp").textContent="—";
  }
}
function renderLegs(legResults, box){
  legResults.forEach((r,i)=>{
    const leg=r.leg, st=statusOf(leg.line);
    const d=document.createElement("div");
    d.className="leg";
    let html='<div class="leg-head">'+lineBadge(leg.line)+'<span>'+esc(stationName(leg.from))+' &rarr; '+esc(stationName(leg.to))+'</span></div>';
    html+='<div class="status-line"><span class="dot '+dotCls(st.cls)+'"></span>'+esc(SEV_LABEL[st.cls]||"Good service")+'</div>';
    if(r.trip){
      html+='<div class="leg-time">Next <b>'+esc(leg.line)+'</b> train in <b>'+countdown(r.trip.bt)+'</b> <span class="leg-sub">('+fmtClock(r.trip.bt)+')</span></div>';
    }else if(!r.feedOk){
      html+='<div class="leg-sub">Live arrivals unavailable for the '+esc(leg.line)+' line right now.</div>';
    }else{
      html+='<div class="leg-sub">No upcoming '+esc(leg.line)+' trains found for this direction.</div>';
    }
    if(st.text) html+='<div class="alert-text">'+esc(st.text)+'</div>';
    d.innerHTML=html;
    box.appendChild(d);

    // transfer card between legs
    if(i===0&&legResults.length>1){
      const t1=r.trip, t2=legResults[1].trip;
      const l2=legResults[1].leg;
      const td=document.createElement("div");
      td.className="leg";
      td.style.borderStyle="dashed";
      let th='<div class="leg-head">Transfer at '+esc(stationName(leg.to))+'</div>';
      if(t1&&t1.at){
        th+='<div class="leg-time">Your '+esc(leg.line)+' arrives at <b>'+fmtClock(t1.at)+'</b>.</div>';
        if(t2){
          const wait=Math.max(0,Math.round((t2.bt-t1.at)/60));
          th+='<div class="leg-time">Next '+esc(l2.line)+' in <b>'+countdown(t2.bt)+'</b> <span class="leg-sub">('+fmtClock(t2.bt)+')</span> &mdash; transfer'+(wait>0?' after a '+wait+'-min wait':' now')+'.</div>';
        }else{
          th+='<div class="leg-sub">Waiting for the next '+esc(l2.line)+' connection&hellip;</div>';
        }
      }else{
        th+='<div class="leg-sub">Transfer to the '+esc(l2.line)+' line here.</div>';
      }
      td.innerHTML=th;
      box.appendChild(td);
    }
    // arrival card after last leg
    if(i===legResults.length-1){
      const t=r.trip;
      const fd=document.createElement("div");
      fd.className="leg";
      fd.innerHTML='<div class="leg-head">Arrive '+esc(stationName(leg.to))+'</div>'+
        (t&&t.at
          ? '<div class="leg-time">Estimated arrival <b>'+fmtClock(t.at)+'</b></div>'
          : '<div class="leg-sub">Arrival time unavailable.</div>');
      box.appendChild(fd);
    }
  });
  if(stationNotes.length){
    const n=document.createElement("div");
    n.className="alert-text";
    n.innerHTML="<b>Station notices:</b><br>"+stationNotes.slice(0,3).map(esc).join("<br>");
    box.appendChild(n);
  }
}
function renderRoute(legResults, walkMin){
  const box=$("legs");
  box.innerHTML="";
  const o=originInfo();
  const firstSt=stationName(legResults[0].leg.from);
  const w=document.createElement("div");
  w.className="leg-sub";
  w.style.margin="8px 0";
  w.textContent = walkMin==null ? "Walk to "+firstSt+": —"
    : "Walk ~"+Math.round(walkMin)+" min from "+(S.direction==="commute"?"home":"work")+" to "+firstSt;
  box.appendChild(w);
  renderLegs(legResults, box);
}
function renderAlts(alts, legResults){
  const box=$("alts");
  box.innerHTML="";
  if(!alts.length){
    const d=document.createElement("div");
    d.className="allclear";
    d.textContent="All clear on your route.";
    box.appendChild(d);
    return;
  }
  const p=document.createElement("div");
  p.className="leg-sub";
  p.textContent="Disruption detected — suggested alternatives:";
  box.appendChild(p);
  alts.forEach(a=>{
    const d=document.createElement("div");
    d.className="alt";
    d.style.cursor="pointer";
    d.innerHTML="<b>Walk ~"+a.walkMin+" min</b> to "+a.lines.map(lineBadge).join("")+esc(a.name)+
      '<div class="leg-sub">Tap for full timing: departures, transfer &amp; arrival.</div>';
    d.onclick=()=>{ viewingAlt={stationId:a.stationId, lines:a.lines, line:a.lines[0]}; loadAll(); };
    box.appendChild(d);
  });
}

/* ===== alternative detail (tap an alternative for full timing) ===== */
let viewingAlt=null; // {stationId, lines, line}
function destStation(){ return S.direction==="commute" ? S.s4.stationId : S.s1.stationId; }
function rejoinLeg(){
  return S.direction==="commute"
    ? {line:S.s3.line, from:S.s3.stationId, to:S.s4.stationId}
    : {line:S.s1.line, from:S.s2.stationId, to:S.s1.stationId};
}
function rejoinStation(){ return S.direction==="commute" ? S.s3.stationId : S.s2.stationId; }

async function nextDepartures(feed, line, stationId, after, n){
  const from=stopSet(stationId);
  const out=[];
  for(const e of (feed.entity||[])){
    const tu=e.trip_update;
    if(!tu||!tu.trip) continue;
    if((tu.trip.route_id||"")!==line) continue;
    for(const stu of (tu.stop_time_update||[])){
      const raw=stu.stop_id||"";
      if(from.has(raw)||from.has(raw.replace(/[NS]$/,""))){
        const bt=num(stu.arrival&&stu.arrival.time)||num(stu.departure&&stu.departure.time);
        if(bt&&bt>=after-120) out.push({bt:bt, headsign:tu.trip.trip_headsign||""});
        break;
      }
    }
  }
  out.sort((a,b)=>a.bt-b.bt);
  return out.slice(0, n||5);
}

async function renderAltDetail(alt){
  const box=$("legs");
  box.innerHTML="";
  const back=document.createElement("button");
  back.className="btn";
  back.style.marginBottom="8px";
  back.textContent="← Back to my route";
  back.onclick=()=>{ viewingAlt=null; loadAll(); };
  box.appendChild(back);
  const h=document.createElement("div");
  h.className="leg-head";
  h.style.marginBottom="4px";
  h.innerHTML="Alternative via "+alt.lines.map(lineBadge).join("")+"<span>"+esc(stationName(alt.stationId))+"</span>";
  box.appendChild(h);

  const o=originInfo();
  const st=ST_BY_ID[alt.stationId];
  let walkMin=null;
  try{ if(st) walkMin=await walkMinutes(o.lat,o.lon,st.lat,st.lon); }catch(e){}
  const w=document.createElement("div");
  w.className="leg-sub";
  w.style.margin="8px 0";
  if(walkMin!=null) w.textContent="Walk ~"+Math.round(walkMin)+" min from "+(S.direction==="commute"?"home":"work")+" to "+st.name;
  box.appendChild(w);

  const line=alt.line||alt.lines[0];
  const dest=destStation();
  // candidate 1: direct ride to destination on the alt line
  let res=await computeRoute([{line:line, from:alt.stationId, to:dest}]);
  if(!(res[0]&&res[0].trip)){
    // candidate 2: ride to the rejoin point, then continue the original second leg
    res=await computeRoute([{line:line, from:alt.stationId, to:rejoinStation()}, rejoinLeg()]);
  }
  if(res[0]&&res[0].trip){
    renderLegs(res, box);
  }else{
    // departures-only fallback: still shows which station and minutes until trains
    const feeds=await fetchFeeds([line]);
    const feed=feeds[FEED_FOR[line]];
    const now=Math.floor(Date.now()/1000);
    const deps=feed?await nextDepartures(feed,line,alt.stationId,now,5):[];
    const d=document.createElement("div");
    d.className="leg";
    if(deps.length){
      d.innerHTML='<div class="leg-head">'+lineBadge(line)+'<span>Next trains at '+esc(st.name)+'</span></div>'+
        deps.map(x=>'<div class="leg-time">in <b>'+countdown(x.bt)+'</b> <span class="leg-sub">('+fmtClock(x.bt)+')</span>'+(x.headsign?' <span class="leg-sub">'+esc(x.headsign)+'</span>':'')+'</div>').join("")+
        '<div class="leg-sub" style="margin-top:6px">No through-route to your destination on this line right now.</div>';
    }else{
      d.innerHTML='<div class="leg-sub">No live departures found for the '+esc(line)+' line right now.</div>';
    }
    box.appendChild(d);
  }
  $("alts").innerHTML='<div class="leg-sub">Showing alternative detail. Tap "← Back to my route" to return.</div>';
  $("updated").textContent="Updated "+fmtHM()+" ET";
}

/* ===== main load ===== */
let loading=false;
async function loadAll(){
  if(loading) return;
  loading=true;
  showErr("");
  $("dir-toggle").innerHTML = S.direction==="commute" ? "To Work &#8646;" : "To Home &#8646;";
  try{
    const o=originInfo();
    await fetchStatus().catch(()=>{});
    const wx=await fetchWeather(o.lat,o.lon).catch(()=>null);
    if(wx) renderWeather(wx);
    if(viewingAlt){
      await renderAltDetail(viewingAlt);
    }else{
      const legResults=await computeRoute(getLegs());
      let walkMin=null;
      try{
        const bs=ST_BY_ID[legResults[0].leg.from];
        if(bs) walkMin=await walkMinutes(o.lat,o.lon,bs.lat,bs.lon);
      }catch(e){}
      renderRoute(legResults, walkMin);
      renderAlts(findAlternatives(legResults), legResults);
      $("updated").textContent="Updated "+fmtHM()+" ET";
    }
  }catch(e){
    showErr("Couldn't load live data. Check your connection and tap Refresh. ("+String(e.message||e).slice(0,80)+")");
  }
  loading=false;
}

/* ===== searchable station picker ===== */
function makePicker(el, key){
  el.innerHTML='<input class="f-input" placeholder="Type station name…" autocomplete="off">'+
    '<div class="picker-list"></div><div class="linechips"></div><div class="picked"></div>';
  const input=el.querySelector("input"), list=el.querySelector(".picker-list"),
        chips=el.querySelector(".linechips"), picked=el.querySelector(".picked");
  function renderPicked(){
    const st=ST_BY_ID[S[key].stationId];
    picked.textContent=st?("Selected: "+st.name+" ("+S[key].line+")"):"Not set";
    chips.innerHTML="";
    if(st&&st.lines.length>1){
      st.lines.forEach(l=>{
        const b=document.createElement("button");
        b.type="button";
        b.className="chip"+(l===S[key].line?" sel":"");
        b.textContent=l;
        b.onclick=()=>{ S[key].line=l; saveSettings(); renderPicked(); };
        chips.appendChild(b);
      });
    }
  }
  function filter(){
    const q=input.value.trim().toLowerCase();
    list.innerHTML="";
    if(!q){ list.classList.remove("open"); return; }
    const matches=STATIONS.filter(s=>s.name.toLowerCase().includes(q)).slice(0,40);
    matches.forEach(s=>{
      const d=document.createElement("div");
      d.className="picker-item";
      d.innerHTML=s.lines.map(lineBadge).join("")+"<span>"+esc(s.name)+"</span>";
      d.onclick=()=>{
        S[key].stationId=s.id;
        if(!s.lines.includes(S[key].line)) S[key].line=s.lines[0];
        saveSettings();
        input.value="";
        list.classList.remove("open");
        renderPicked();
      };
      list.appendChild(d);
    });
    list.classList.toggle("open", matches.length>0);
  }
  input.addEventListener("input", filter);
  input.addEventListener("focus", filter);
  document.addEventListener("click", e=>{ if(!el.contains(e.target)) list.classList.remove("open"); });
  renderPicked();
  return { refresh: renderPicked };
}
let pickers=[];
function initSettings(){
  $("set-home").value=S.home.label||"";
  $("set-work").value=S.work.label||"";
  pickers=[makePicker($("pk1"),"s1"),makePicker($("pk2"),"s2"),makePicker($("pk3"),"s3"),makePicker($("pk4"),"s4")];
  $("sheet-close").onclick=()=>$("sheet").classList.remove("open");
  $("settings-btn").onclick=()=>$("sheet").classList.add("open");
  $("sheet").addEventListener("click",e=>{ if(e.target===$("sheet")) $("sheet").classList.remove("open"); });
  $("set-save").onclick=async ()=>{
    const hl=$("set-home").value.trim(), wl=$("set-work").value.trim();
    const btn=$("set-save");
    btn.textContent="Saving…";
    try{
      if(hl&&hl!==S.home.label){
        const g=await geocode(hl);
        if(g) S.home={label:hl,lat:g.lat,lon:g.lon}; else S.home.label=hl;
      }
      if(wl&&wl!==S.work.label){
        const g=await geocode(wl);
        if(g) S.work={label:wl,lat:g.lat,lon:g.lon}; else S.work.label=wl;
      }
      saveSettings();
      pickers.forEach(p=>p.refresh());
      $("sheet").classList.remove("open");
      loadAll();
    }catch(e){ showErr("Couldn't save settings: "+String(e.message||e).slice(0,80)); }
    btn.textContent="Save";
  };
}

/* ===== init ===== */
$("refresh-btn").onclick=()=>loadAll();
$("dir-toggle").onclick=()=>{
  S.direction = S.direction==="commute" ? "homebound" : "commute";
  saveSettings();
  loadAll();
};
initSettings();
loadAll();
setInterval(loadAll, 60000);

</script>
